<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTree | Links</title>
    <style>

        body {
            background-color: #0f0f13; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #7289da; 
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; margin-bottom: 5px; }
        p { color: #a0a0a0; margin-bottom: 30px; }

        .link-btn {
            display: block;
            background-color: #1e1e24;
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid #2f2f38;
        }
        .link-btn:hover {
            background-color: #7289da; 
            transform: scale(1.02);
        }
        .status-box {
            background-color: #151515;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #00ff88; 
            border: 1px dashed #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <img th:src="${profile.avatarUrl}" class="avatar" alt="Avatar">
        
        <h1 th:text="${profile.nome}">Nome Carregando...</h1>
        <p th:text="${profile.bio}">Bio Carregando...</p>

        <div class="status-box">
            <span th:text="${profile.statusServidor}">Carregando status...</span>
        </div>
        
        <hr style="border-color: #333; margin: 25px 0;">

        <div th:each="link : ${profile.links}">
            <a th:href="${link.url}" 
               th:text="${link.titulo}" 
               class="link-btn" 
               target="_blank">Link Extra</a>
        </div>

    </div>

</body>
</html>
