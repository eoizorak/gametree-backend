<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTree | Links</title>
    <style>
        /* Estilo Gamer Dark */
        body {
            background-color: #0f0f13; /* Fundo quase preto */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #7289da; /* Roxo Discord */
            margin-bottom: 15px;
        }
        h1 { font-size: 22px; margin-bottom: 5px; }
        p { color: #a0a0a0; margin-bottom: 30px; }

        .link-btn {
            display: block;
            background-color: #1e1e24;
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid #2f2f38;
        }
        .link-btn:hover {
            background-color: #7289da; /* Hover roxo */
            transform: scale(1.02);
        }
        .status-box {
            background-color: #151515;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #00ff88; /* Verde Hacker */
            border: 1px dashed #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://ui-avatars.com/api/?name=Matheus+Dev&background=7289da&color=fff" class="avatar" alt="Avatar">
        
        <h1>Matheus Dev</h1>
        <p>Desenvolvedor Java | Gamer</p>

        <div class="status-box">
            🟢 Servidor Online: 12/50 Jogadores
        </div>

        <a href="#" class="link-btn">🎮 Meu Discord</a>
        <a href="#" class="link-btn">📺 Canal no YouTube</a>
        <a href="#" class="link-btn">📷 Instagram</a>
        
    </div>

</body>
</html>
