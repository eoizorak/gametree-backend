<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin | GameTree</title>
    <style>
        body { background-color: #0f0f13; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        form { background-color: #1e1e24; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; border: 1px solid #2f2f38; }
        h2 { color: #00ff88; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 15px; color: #a0a0a0; font-size: 14px; }
        input { width: 95%; padding: 10px; margin-top: 5px; background-color: #151515; border: 1px solid #444; color: white; border-radius: 5px; }
        button { width: 100%; margin-top: 25px; padding: 15px; background-color: #00ff88; color: black; border: none; font-weight: bold; cursor: pointer; font-size: 16px; border-radius: 5px; }
        button:hover { background-color: #00cc6a; }
    </style>
</head>
<body>

    <form action="/admin/save" method="post" th:object="${profile}">
        <h2>🔧 Editar Perfil</h2>

        <input type="hidden" th:field="*{id}">

        <label>Nome do Perfil</label>
        <input type="text" th:field="*{nome}" required>

        <label>Bio / Descrição</label>
        <input type="text" th:field="*{bio}">

        <label>Link do Avatar (Imagem)</label>
        <input type="text" th:field="*{avatarUrl}">

        <label>Status do Servidor (ex: 🟢 Online)</label>
        <input type="text" th:field="*{statusServidor}">

        <hr style="border-color: #333; margin-top: 20px;">

        <label>Link Discord</label>
        <input type="text" th:field="*{discordUrl}">

        <label>Link YouTube</label>
        <input type="text" th:field="*{youtubeUrl}">

        <label>Link Instagram</label>
        <input type="text" th:field="*{instagramUrl}">

        <button type="submit">Salvar Alterações</button>
    </form>

</body>
</html>
